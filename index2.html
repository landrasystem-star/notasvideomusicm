    // ========== VARIABLES ==========
    let player = null;
    let canalActualIndex = 0;
    let categoriaActiva = "Todos";
    let notas = [];
    let config = { token: '', gistId: '' };
    let notaSeleccionadaId = null;
    let githubConfigVisible = true;

    // ========== FUNCIÓN DE CONVERSIÓN DE ENLACES (COMO EL ORIGINAL) ==========
    function convertirEnlaces(texto) {
        // YouTube
        texto = texto.replace(/(https?:\/\/)?(www\.)?(youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/g, (match, p1, p2, p3, id) => {
            const url = `https://www.youtube.com/watch?v=${id}`;
            const miniatura = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
            return `<div style="margin: 10px 0; text-align: center;">
                        <a href="${url}" target="_blank" rel="noopener noreferrer">
                            <img src="${miniatura}" alt="Miniatura" style="max-width: 100%; border-radius: 10px;">
                        </a>
                        <div style="font-size: 0.7em; margin-top: 4px;">
                            <a href="${url}" target="_blank" rel="noopener noreferrer">🎬 Ver video en YouTube</a>
                        </div>
                    </div>`;
        });

        // Imágenes
        texto = texto.replace(/(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp)(\?[^\s]*)?)/gi, (url) => {
            let urlLimpia = url.split('?')[0];
            return `<div style="margin: 10px 0; text-align: center;">
                        <img src="${urlLimpia}" alt="imagen" style="max-width: 100%; border-radius: 10px;" onerror="this.style.display='none'">
                        <div style="font-size: 0.7em; margin-top: 4px;">
                            <a href="${url}" target="_blank" rel="noopener noreferrer">🔗 ${url}</a>
                        </div>
                    </div>`;
        });

        // Enlaces normales - ¡CLICABLES!
        texto = texto.replace(/(https?:\/\/[^\s]+)/g, (url) => {
            if (url.includes('youtube.com') || url.includes('youtu.be') || url.match(/\.(jpg|jpeg|png|gif|webp)/i)) return url;
            return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:#4ecdc4; text-decoration:underline;">${url}</a>`;
        });

        texto = texto.replace(/\n/g, '<br>');
        return texto;
    }

    // ========== REPRODUCTOR ==========
    function initPlayer() {
        const video = document.getElementById('musicPlayer');
        if (Hls.isSupported()) {
            player = new Hls({ enableWorker: true, lowLatencyMode: true });
            player.attachMedia(video);
        }
    }

    function canalesFiltrados() {
        let filtrados = canalesMusicales;
        if (categoriaActiva !== "Todos") filtrados = filtrados.filter(c => c.categoria === categoriaActiva);
        const busqueda = document.getElementById('searchChannel')?.value.toLowerCase() || '';
        if (busqueda) filtrados = filtrados.filter(c => c.nombre.toLowerCase().includes(busqueda));
        return filtrados;
    }

    function reproducirCanalPorIndice(index, reintento = 0) {
        const filtrados = canalesFiltrados();
        if (index < 0) index = 0;
        if (index >= filtrados.length) index = filtrados.length - 1;
        const canal = filtrados[index];
        if (!canal) return;
        
        canalActualIndex = index;
        document.getElementById('nowPlaying').innerHTML = `🔄 ${canal.nombre}...`;
        
        if (Hls.isSupported() && player && player.destroy) player.destroy();
        initPlayer();
        
        setTimeout(() => {
            if (Hls.isSupported() && player) {
                player.loadSource(canal.url);
                player.attachMedia(document.getElementById('musicPlayer'));
                
                const timeout = setTimeout(() => {
                    if (reintento < 2) {
                        const siguienteIndex = (index + 1) % filtrados.length;
                        reproducirCanalPorIndice(siguienteIndex, reintento + 1);
                    }
                }, 8000);
                
                player.on(Hls.Events.MANIFEST_PARSED, () => {
                    clearTimeout(timeout);
                    const video = document.getElementById('musicPlayer');
                    video.play().catch(e => console.log("play bloqueado"));
                    document.getElementById('nowPlaying').innerHTML = canal.nombre;
                });
            }
        }, 100);
        
        document.querySelectorAll('.channel-item').forEach((item, i) => {
            if (i === index) item.classList.add('active');
            else item.classList.remove('active');
        });
    }

    function siguienteCanal() {
        const filtrados = canalesFiltrados();
        reproducirCanalPorIndice((canalActualIndex + 1) % filtrados.length);
    }
    
    function anteriorCanal() {
        const filtrados = canalesFiltrados();
        reproducirCanalPorIndice((canalActualIndex - 1 + filtrados.length) % filtrados.length);
    }
    
    function detenerReproduccion() {
        const video = document.getElementById('musicPlayer');
        video.pause();
        if (player && player.destroy) player.destroy();
        video.src = '';
        document.getElementById('nowPlaying').innerHTML = "Detenido";
    }
    
    function mostrarCanales() {
        const filtrados = canalesFiltrados();
        document.getElementById('channelsList').innerHTML = filtrados.map((canal, idx) => `
            <div class="channel-item ${idx === canalActualIndex ? 'active' : ''}" onclick="reproducirCanalPorIndice(${idx})">
                <span>${canal.nombre.charAt(0)}</span>
                <div class="channel-name">${escapeHtml(canal.nombre)}</div>
                <div class="channel-cat">${canal.categoria}</div>
            </div>`).join('');
    }
    
    function cargarCategorias() {
        const cats = ["Todos", ...new Set(canalesMusicales.map(c => c.categoria))];
        document.getElementById('categories').innerHTML = cats.map(cat => `<button class="cat-btn ${cat === categoriaActiva ? 'active' : ''}" onclick="cambiarCategoria('${cat}')">${cat}</button>`).join('');
    }
    
    function cambiarCategoria(cat) { 
        categoriaActiva = cat; 
        cargarCategorias(); 
        mostrarCanales(); 
        reproducirCanalPorIndice(0);
    }
    
    function filtrarCanales() { mostrarCanales(); }
    function iniciarCanalPorDefecto() { setTimeout(() => reproducirCanalPorIndice(0), 1500); }

    // ========== NOTAS CON ENLACES CLICABLES ==========
    function guardarNota() {
        const titulo = document.getElementById('noteTitle').value;
        const contenido = document.getElementById('noteContent').value;
        if (!titulo && !contenido) return;
        const nota = { id: Date.now(), titulo: titulo || "Sin título", contenido: contenido, fecha: new Date().toLocaleString() };
        notas.unshift(nota);
        guardarNotasLocales();
        mostrarNotas();
        document.getElementById('noteTitle').value = '';
        document.getElementById('noteContent').value = '';
        if (config.token && config.gistId) subirAGitHub();
        mostrarStatus('✅ Nota guardada');
    }

    function eliminarNota(id) {
        if (confirm('¿Eliminar nota? Se borrará de local y nube')) {
            notas = notas.filter(n => n.id !== id);
            guardarNotasLocales();
            mostrarNotas();
            if (config.token && config.gistId) subirAGitHub();
            if (notaSeleccionadaId === id) notaSeleccionadaId = null;
            mostrarStatus('🗑️ Nota eliminada');
        }
    }

    function eliminarTodasNotas() {
        if (confirm('¿Eliminar TODAS las notas?')) {
            notas = [];
            guardarNotasLocales();
            mostrarNotas();
            if (config.token && config.gistId) subirAGitHub();
            mostrarStatus('🗑️ Todas las notas eliminadas');
        }
    }

    function seleccionarNota(id) {
        notaSeleccionadaId = id;
        document.querySelectorAll('.note-card').forEach(card => {
            if (card.getAttribute('data-id') == id) card.classList.add('selected');
            else card.classList.remove('selected');
        });
    }

    function guardarNotasLocales() { localStorage.setItem('blocNotas', JSON.stringify(notas)); }
    
    function mostrarNotas() {
        const container = document.getElementById('notesList');
        if (notas.length === 0) {
            container.innerHTML = '<div style="color:#aaa; text-align:center; padding:15px;">✨ Sin notas</div>';
            return;
        }
        container.innerHTML = notas.map(nota => `
            <div class="note-card" data-id="${nota.id}" onclick="seleccionarNota(${nota.id})">
                <div class="note-title">📌 ${escapeHtml(nota.titulo)}</div>
                <div class="note-content">${convertirEnlaces(escapeHtml(nota.contenido))}</div>
                <div class="note-date">${nota.fecha}</div>
                <button class="delete-note" onclick="event.stopPropagation(); eliminarNota(${nota.id})">🗑️ Eliminar</button>
            </div>
        `).join('');
    }

    async function subirImagen() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('image', file);
            mostrarStatus('📤 Subiendo imagen...');
            try {
                const res = await fetch('https://api.imgur.com/3/image', {
                    method: 'POST',
                    headers: { 'Authorization': 'Client-ID 546c25a59c58ad7' },
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('noteContent').value += `\n📸 ${data.data.link}\n`;
                    mostrarStatus('✅ Imagen subida');
                } else { mostrarStatus('❌ Error'); }
            } catch(err) { mostrarStatus('❌ Error conexión'); }
        };
        input.click();
    }

    // ========== EXPORTAR ==========
    function exportarHTML() {
        if (notas.length === 0) { mostrarStatus('❌ No hay notas'); return; }
        let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Mis Notas</title><style>body{font-family:Arial;margin:40px;background:#f5f5f5}.nota{background:white;border-radius:15px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}.nota h3{color:#667eea}img{max-width:100%;border-radius:10px}</style></head><body><h1>📝 Mis Notas</h1><p>Exportado: ${new Date().toLocaleString()}</p><hr>`;
        notas.forEach(n => {
            let cont = escapeHtml(n.contenido);
            cont = cont.replace(/(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/gi, url => `<img src="${url}" style="max-width:100%"><br><a href="${url}">🔗 ${url}</a>`);
            cont = cont.replace(/(https?:\/\/[^\s]+)/g, url => `<a href="${url}" target="_blank">${url}</a>`);
            html += `<div class="nota"><h3>📌 ${escapeHtml(n.titulo)}</h3><div>${cont}</div><div style="color:#999;font-size:12px">📅 ${n.fecha}</div></div>`;
        });
        html += `</body></html>`;
        const blob = new Blob([html], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `notas_${Date.now()}.html`;
        a.click();
        URL.revokeObjectURL(blob);
        mostrarStatus('✅ HTML exportado');
    }

    // ========== GITHUB ==========
    async function subirAGitHub() {
        if (!config.token) { mostrarStatus('❌ Configura GitHub'); return; }
        const data = { description: 'Mis notas', public: false, files: { 'notas.json': { content: JSON.stringify(notas, null, 2) } } };
        try {
            let url = 'https://api.github.com/gists', method = 'POST';
            if (config.gistId) { url = `https://api.github.com/gists/${config.gistId}`; method = 'PATCH'; }
            const res = await fetch(url, { method, headers: { 'Authorization': `token ${config.token}` }, body: JSON.stringify(data) });
            if (res.ok && !config.gistId) {
                const result = await res.json();
                config.gistId = result.id;
                localStorage.setItem('github_gist_id', result.id);
                document.getElementById('gistId').value = result.id;
            }
            mostrarStatus('✅ Subido a GitHub');
        } catch(e) { mostrarStatus('❌ Error'); }
    }

    async function sincronizarDesdeGitHub() {
        if (!config.token || !config.gistId) { mostrarStatus('❌ Configura GitHub'); return; }
        try {
            const res = await fetch(`https://api.github.com/gists/${config.gistId}`, { headers: { 'Authorization': `token ${config.token}` } });
            if (res.ok) {
                const gist = await res.json();
                const content = gist.files['notas.json']?.content;
                if (content) {
                    notas = JSON.parse(content);
                    guardarNotasLocales();
                    mostrarNotas();
                    mostrarStatus('✅ Sincronizado');
                }
            }
        } catch(e) { mostrarStatus('❌ Error'); }
    }

    function guardarConfiguracion() {
        config.token = document.getElementById('githubToken').value;
        config.gistId = document.getElementById('gistId').value;
        if (config.token) localStorage.setItem('github_token', config.token);
        if (config.gistId) localStorage.setItem('github_gist_id', config.gistId);
        mostrarStatus('✅ Configuración guardada');
    }

    function cargarConfiguracion() {
        config.token = localStorage.getItem('github_token') || '';
        config.gistId = localStorage.getItem('github_gist_id') || '';
        if (config.token) document.getElementById('githubToken').value = config.token;
        if (config.gistId) document.getElementById('gistId').value = config.gistId;
        const saved = localStorage.getItem('blocNotas');
        if (saved) { notas = JSON.parse(saved); mostrarNotas(); }
        if (config.token && config.gistId) setTimeout(() => sincronizarDesdeGitHub(), 1000);
    }

    // ========== UI ==========
    function toggleChannels() { document.getElementById('channelsSidebar').classList.toggle('open'); }
    function toggleNotes() { document.getElementById('notesSidebar').classList.toggle('open'); }
    function toggleGitHubConfig() {
        githubConfigVisible = !githubConfigVisible;
        document.getElementById('githubBody').classList.toggle('hidden', !githubConfigVisible);
        document.getElementById('githubToggleBtn').innerHTML = githubConfigVisible ? '−' : '+';
    }
    function minimizarNotas() {
        const content = document.getElementById('notesContent');
        const btn = document.getElementById('minimizeBtn');
        if (content.style.display === 'none') {
            content.style.display = 'block';
            btn.innerHTML = '─';
        } else {
            content.style.display = 'none';
            btn.innerHTML = '+';
        }
    }
    function toggleModoOscuro() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('modo_oscuro', document.body.classList.contains('dark-mode'));
    }
    function mostrarStatus(msg) {
        const statusDiv = document.getElementById('statusMessage');
        statusDiv.textContent = msg;
        setTimeout(() => { statusDiv.textContent = '✅ Listo'; }, 2000);
    }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    // ========== INICIALIZACIÓN ==========
    document.getElementById('toggleChannelsBtn').addEventListener('click', toggleChannels);
    document.getElementById('toggleNotesBtn').addEventListener('click', toggleNotes);
    document.getElementById('prevBtn').addEventListener('click', anteriorCanal);
    document.getElementById('nextBtn').addEventListener('click', siguienteCanal);
    
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp') { e.preventDefault(); anteriorCanal(); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); siguienteCanal(); }
        else if (e.key >= '1' && e.key <= '9') { e.preventDefault(); const f = canalesFiltrados(); if (parseInt(e.key) <= f.length) reproducirCanalPorIndice(parseInt(e.key)-1); }
        else if (e.key === 'Delete' && notaSeleccionadaId) eliminarNota(notaSeleccionadaId);
        else if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); guardarNota(); }
    });

    function init() {
        initPlayer();
        cargarCategorias();
        mostrarCanales();
        cargarConfiguracion();
        iniciarCanalPorDefecto();
        if (localStorage.getItem('modo_oscuro') === 'true') document.body.classList.add('dark-mode');
        setInterval(() => { if (config.token && config.gistId) sincronizarDesdeGitHub(); }, 30000);
    }

    window.reproducirCanalPorIndice = reproducirCanalPorIndice;
    window.cambiarCategoria = cambiarCategoria;
    window.filtrarCanales = filtrarCanales;
    window.guardarNota = guardarNota;
    window.eliminarNota = eliminarNota;
    window.eliminarTodasNotas = eliminarTodasNotas;
    window.seleccionarNota = seleccionarNota;
    window.subirImagen = subirImagen;
    window.detenerReproduccion = detenerReproduccion;
    window.subirAGitHub = subirAGitHub;
    window.sincronizarDesdeGitHub = sincronizarDesdeGitHub;
    window.guardarConfiguracion = guardarConfiguracion;
    window.toggleGitHubConfig = toggleGitHubConfig;
    window.minimizarNotas = minimizarNotas;
    window.exportarHTML = exportarHTML;
    window.toggleModoOscuro = toggleModoOscuro;
    window.anteriorCanal = anteriorCanal;
    window.siguienteCanal = siguienteCanal;

    init();
</script>
